name: Verify skills.sh listing

on:
  push:
    paths:
      - ".github/workflows/verify-skills-listing.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify skills.sh page
        run: |
          set -euo pipefail
          URL="https://skills.sh/skcache/prnotes/pr-notes"
          code="$(curl -L -sS -o /tmp/skills-page.html -w '%{http_code}' "$URL")"
          echo "HTTP $code"
          test "$code" = "200"
          grep -qi "pr-notes" /tmp/skills-page.html
          echo "Listing visible: $URL"
